<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sync Matrix</title>
  <link rel="stylesheet" href="sync_matrix.css?v=7363127a19">
</head>
<body>
  <form class="sm-toolbar" hidden onsubmit="return false">
    <label>Matrix <select id="sm-matrix"></select></label>
    <label id="sm-locality-picker" hidden>Locality <select id="sm-locality"></select></label>
    <span class="sm-date-picker">
      <button type="button" id="sm-older" aria-label="Previous day">&#9664;</button>
      <label>Date <select id="sm-date"></select></label>
      <button type="button" id="sm-newer" aria-label="Next day">&#9654;</button>
    </span>
    <span class="sm-grouping" id="sm-grouping" hidden>
      <span id="sm-grouping-label">Group by</span>
      <span class="sm-segmented" role="radiogroup" aria-labelledby="sm-grouping-label"></span>
    </span>
    <label class="sm-switch">
      <input type="checkbox" id="sm-daylight-toggle" role="switch" checked>
      <span class="sm-switch-track" aria-hidden="true"></span>
      Day/night shading
    </label>
    <span class="sm-grouping" id="sm-export">
      <span id="sm-export-label">Export</span>
      <span class="sm-segmented" role="group" aria-labelledby="sm-export-label">
        <button type="button" data-format="png" title="Download as PNG (for slides)">PNG</button>
        <button type="button" data-format="svg" title="Download as SVG (scalable)">SVG</button>
      </span>
    </span>
    <span class="sm-icod-badge" id="sm-icod-badge"></span>
  </form>
  <div id="sync-matrix" class="sync-matrix">
    <div class="sm-status" role="status"></div>
  </div>
  <div class="sm-tooltip" hidden></div>

  <script src="vendor/d3.v7.9.0.min.js"></script>
  <script src="sync_matrix.js?v=838a22292c"></script>
</body>
</html>
