# Checks that reviews used to do by hand. Runs on every PR and on main.
#
# checks:
#   - exporter and pass-prediction tests (pytest): config checks, ICOD rules,
#     output layout, events, pass thresholds/daylight/SAR swath, roll-up,
#     day/night shading at extreme latitudes, end of local day
#   - data: every web/data and web/live JSON parses and matches its index.json
#   - libraries: web/data matches a fresh build from config/, and web/live a
#     fresh pass prediction from the committed TLE snapshot
#   - JavaScript: web/*.js and inline <script> blocks pass `node --check`
# browser:
#   - the real page in headless Chromium (tests/browser): layout, controls,
#     day/night shading, export, single-file mode, the dashboard iframe

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Exporter tests
        run: python -m pytest -q tests --ignore=tests/browser

      - name: Data files
        run: |
          python scripts/check_data.py
          python scripts/check_data.py --live

      - name: Libraries match a fresh build
        run: |
          python scripts/check_demo_data.py
          python scripts/check_demo_data.py --live

      - name: JavaScript syntax
        run: python scripts/check_js_syntax.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
          python -m playwright install --with-deps chromium

      - name: Browser tests
        run: python -m pytest -q tests/browser --screenshot only-on-failure

      - name: Screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
