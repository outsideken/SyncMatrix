# Checks that reviews used to do by hand. Runs on every PR and on main.
#
#   - exporter tests (pytest): config checks, ICOD rules, output layout, events,
#     day/night shading at extreme latitudes, end of local day
#   - data: every web/data JSON parses and matches index.json
#   - demo data: web/data matches a fresh build from config/
#   - JavaScript: web/*.js and inline <script> blocks pass `node --check`

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Exporter tests
        run: python -m pytest -q tests

      - name: Data files
        run: python scripts/check_data.py

      - name: Demo data matches config/
        run: python scripts/check_demo_data.py

      - name: JavaScript syntax
        run: python scripts/check_js_syntax.py
