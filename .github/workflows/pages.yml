# Publish web/ (the d3 Sync Matrix page, vendored d3, the demo library in
# web/data and the predicted-pass library in web/live) to
# GitHub Pages whenever main changes. Every path in web/ is relative, so the
# site works under https://<owner>.github.io/SyncMatrix/ as-is.
#
# One-time repo setting: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". A Pages site is public even when the repo is private.

name: Deploy Sync Matrix to Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Fail early if any library file is broken: every JSON parses, every
      # file in index.json exists, payloads have ICOD + provenance, events
      # are on real rows. Same script CI runs; it needs only the standard library.
      - name: Check data files
        run: |
          python3 scripts/check_data.py
          python3 scripts/check_data.py --live

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v5
