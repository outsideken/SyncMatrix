# Daily refresh of the predicted-pass library (web/live): new Celestrak orbits,
# rebuilt passes, checked, committed to main, then redeployed to Pages.
#
# A push made with the workflow's own token does not start other workflows, so
# this job runs the unit tests itself and starts the Pages deploy explicitly.
# Celestrak is asked for each satellite once a day, one request per second.

name: Refresh predicted passes

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write   # commit the new snapshot and web/live
  actions: write    # start the Pages deploy

concurrency:
  group: refresh-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Fetch orbits, rebuild web/live, check
        run: python scripts/refresh_live_data.py --keep 14

      - name: Unit tests against the new snapshot
        run: python -m pytest -q tests --ignore=tests/browser

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tle data/predicted web/live
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            snapshot=$(ls data/tle/celestrak-*.json | sort | tail -1 | xargs basename)
            git commit -m "Refresh predicted passes from $snapshot"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
